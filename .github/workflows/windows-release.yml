name: Windows release installer

on:
  workflow_dispatch:
  push:
    branches:
      - v1.1

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22
      - name: Install locked dependencies and rebuild native modules
        run: yarn install --frozen-lockfile
      - name: Build unsigned Windows x64 NSIS installer
        run: yarn build --win nsis --x64 --nosign --publish never
      - name: Collect installer and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-output | Out-Null
          $installer = Get-ChildItem dist_electron/bundled -Filter 'Techflow-v1.0.0-windows-x64.exe' | Select-Object -First 1
          if (!$installer) { throw 'Techflow installer was not produced' }
          Copy-Item $installer.FullName release-output/
          New-Item -ItemType Directory -Force release-output/demo | Out-Null
          Copy-Item demo/techflow-egypt-demo.sqlite release-output/demo/
          Copy-Item demo/TEST_REPORT_AR.md release-output/demo/
          Copy-Item demo/README_AR.md release-output/demo/
          $copied = Get-Item (Join-Path release-output $installer.Name)
          $hash = (Get-FileHash $copied.FullName -Algorithm SHA256).Hash
          "$hash  $($copied.Name)  $($copied.Length) bytes" | Set-Content release-output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Techflow-v1.0.0-windows-x64-v1.1
          path: release-output/
          if-no-files-found: error
          retention-days: 30
